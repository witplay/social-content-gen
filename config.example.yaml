# 自媒体热点内容生成器 - 配置文件示例
# 复制为 config.yaml 并填写你的配置

# LLM配置（至少启用一个）
llm:
  # OpenAI（推荐）
  openai:
    enabled: false
    api_key: "sk-..."
    model: "gpt-4o-mini"  # 或 gpt-4o
    base_url: ""  # 留空使用官方API
  
  # 阿里通义千问
  qwen:
    enabled: false
    api_key: "sk-..."
    model: "qwen-plus"
  
  # 本地模型（通过Ollama/vLLM等）
  local:
    enabled: false
    base_url: "http://localhost:8000/v1"
    model: "qwen2.5-72b"
    api_key: ""

# 热点源配置
sources:
  # TrendRadar数据库路径
  trendradar_db: "/www/wwwroot/MCP/TrendRadar/output/news/"
  # 最大热点数量
  max_topics: 10
  # 最低排名（只获取排名前N的）
  min_rank: 5

# 内容生成配置
generation:
  # 语言风格: professional/casual/emotional/technical
  style: "professional"
  # 文章长度: short/medium/long
  length: "medium"
  # 是否包含数据引用
  include_data: true
  # 是否包含个人观点
  include_opinion: true

# 输出配置
output:
  # 输出目录
  dir: "./output"
  # 输出格式: json/markdown/all
  format: "all"
  # 是否按日期创建子目录
  date_subdir: true

# 发布配置（可选）
publish:
  # 公众号
  wechat_mp:
    enabled: false
    # 通过MCP或API发布
  # 小红书
  xiaohongshu:
    enabled: false
  # 抖音
  douyin:
    enabled: false
